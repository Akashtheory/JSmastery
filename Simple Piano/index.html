<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Piano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Simple Piano</h1>
  <div id="piano">
    <button class="key" data-note="C4">C4</button>
    <button class="key" data-note="D4">D4</button>
    <button class="key" data-note="E4">E4</button>
    <button class="key" data-note="F4">F4</button>
    <button class="key" data-note="G4">G4</button>
    <button class="key" data-note="A4">A4</button>
    <button class="key" data-note="B4">B4</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
