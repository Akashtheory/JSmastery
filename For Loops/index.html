<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Right Angle Star Pattern Generator</h2>
    
    <!-- Input for the number of lines -->
    <label for="rowInput">Enter number of lines (e.g., 10 or 20):</label>
    <input type="number" id="rowInput" placeholder="Enter a number">
    
    <!-- Button to generate the pattern -->
    <button onclick="generatePattern()">Generate Pattern</button>

    <!-- Area to display the output -->
    <pre id="patternDisplay"></pre>

    <!-- Linking the JS file -->
    <script src="script.js"></script>
    
</body>
</html>
